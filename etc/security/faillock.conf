# Omarchy override of /etc/security/faillock.conf (upstream owned by `pam`).
# The only behavioural change vs upstream defaults is raising `deny` from 3 to
# 10 so users get more attempts before lockout.
#
# Root is counted too. On a child install (kids mode) the parent password is
# root's password, and sudo and polkit authenticate root for it, so without
# this a kid could hammer the parent prompt while their own account is the
# only one that ever locks. root_unlock_time keeps the lockout as short as the
# account one; on other installs nothing authenticates as root but `su`.
#
# All other settings remain at upstream defaults (commented out). See
# faillock.conf(5) for the full option list.
deny = 10
even_deny_root
root_unlock_time = 120
