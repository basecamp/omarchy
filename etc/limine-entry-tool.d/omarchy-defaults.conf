TARGET_OS_NAME="Omarchy"

KERNEL_CMDLINE[default]+=" quiet splash loglevel=0 systemd.show_status=false rd.udev.log_level=0 vt.global_cursor_default=0"

# Kernel 7.1 unpacks the initramfs asynchronously, which races /init: the
# early /proc, /sys, /dev, and /run mounts fail while unpacking settles, so
# plymouthd exits when it can't read /proc/cmdline and encrypted boots fall
# back to an unthemed text LUKS prompt. Unpack synchronously until the race
# is fixed upstream.
KERNEL_CMDLINE[default]+=" initramfs_async=0"

CUSTOM_UKI_NAME="omarchy"
ENABLE_LIMINE_FALLBACK=yes

# Find and add other bootloaders
FIND_BOOTLOADERS=yes

BOOT_ORDER="*, *fallback, Snapshots"

# Snapper is configured with NUMBER_LIMIT="5" (see default/snapper/root), but
# limine-snapper-sync can see the newly created sixth snapshot before cleanup
# restores the retained snapshot count to 5. Allow for that creation window:
#   Snapshot limit mismatch: 6 Snapper snapshots exceed configured
#   MAX_SNAPSHOT_ENTRIES=5
MAX_SNAPSHOT_ENTRIES=6

SNAPSHOT_FORMAT_CHOICE=5

# Show the Omarchy logo from the moment systemd-stub takes over, so the
# firmware logo does not sit on screen until Plymouth starts. The stub renders
# the UKI's .splash section, which it only accepts as a Windows BMP, so the
# image is committed as one rather than derived from the theme's logo.png at
# build time.
#
# The path has to be a literal: limine-entry-tool reads these drop-ins with a
# key=value line parser, not by sourcing them, so neither $OMARCHY_PATH nor a
# guard around a missing file would survive. It points at the Plymouth theme
# because omarchy-settings owns that directory, which keeps efi-splash.bmp present
# for every UKI build — mkinitcpio aborts on a --splash file it cannot read.
MKINITCPIO_UKI_OPTIONS="--splash /usr/share/plymouth/themes/omarchy/efi-splash.bmp"
