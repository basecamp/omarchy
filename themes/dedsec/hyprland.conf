# DedSec — Hyprland theme overrides
# Neon green active borders, subtle transparency for depth

$activeBorderColor = rgb(00FF41)
$inactiveBorderColor = rgb(1E3044)

general {
    col.active_border = $activeBorderColor
    col.inactive_border = $inactiveBorderColor
}

group {
    col.border_active = $activeBorderColor
    col.border_inactive = $inactiveBorderColor
}

# Slightly translucent terminals for that surveillance-feed look
windowrule = opacity 0.95 0.88, match:tag terminal
