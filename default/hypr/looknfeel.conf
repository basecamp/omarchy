# DedSecOS // Hyprland Look & Feel
# Dense. Dark. Tactical.

# Variables
$activeBorderColor = rgba(00FF41cc) rgba(00E5FFcc) 45deg
$inactiveBorderColor = rgba(1E304488)

# https://wiki.hyprland.org/Configuring/Variables/#general
general {
    gaps_in = 2
    gaps_out = 4

    border_size = 2

    col.active_border = $activeBorderColor
    col.inactive_border = $inactiveBorderColor

    resize_on_border = false
    allow_tearing = false

    layout = dwindle
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    rounding = 0

    shadow {
        enabled = true
        range = 6
        render_power = 2
        color = rgba(00FF4118)
    }

    blur {
        enabled = true
        size = 4
        passes = 3
        special = true
        brightness = 0.50
        contrast = 0.85
    }
}

# https://wiki.hypr.land/Configuring/Variables/#group
group {
    col.border_active = $activeBorderColor
    col.border_inactive = $inactiveBorderColor
    col.border_locked_active = -1
    col.border_locked_inactive = -1

    groupbar {
        font_size = 12
        font_family = JetBrainsMono Nerd Font
        font_weight_active = ultraheavy
        font_weight_inactive = normal

        indicator_height = 0
        indicator_gap = 4
        height = 22
        gaps_in = 2
        gaps_out = 0

        text_color = rgb(B0F4E6)
        text_color_inactive = rgba(B0F4E660)
        col.active = rgba(00FF4120)
        col.inactive = rgba(050A0E40)

        gradients = true
        gradient_rounding = 0
        gradient_round_only_edges = false
    }
}


# https://wiki.hyprland.org/Configuring/Variables/#animations
animations {
    enabled = yes, please :)

    # Tactical beziers -- fast, decisive, no floaty nonsense
    bezier = snappy,0.2,1,0.3,1
    bezier = instant,0.05,0.9,0.1,1
    bezier = linear,0,0,1,1
    bezier = almostLinear,0.5,0.5,0.75,1.0

    animation = global, 1, 6, default
    animation = border, 1, 3, snappy
    animation = windows, 1, 2.8, snappy
    animation = windowsIn, 1, 2.4, snappy, popin 92%
    animation = windowsOut, 1, 1.0, instant, popin 92%
    animation = fadeIn, 1, 1.2, almostLinear
    animation = fadeOut, 1, 0.8, almostLinear
    animation = fade, 1, 2, snappy
    animation = layers, 1, 2.2, snappy
    animation = layersIn, 1, 2.4, snappy, fade
    animation = layersOut, 1, 1.0, instant, fade
    animation = fadeLayersIn, 1, 1.2, almostLinear
    animation = fadeLayersOut, 1, 0.8, almostLinear
    animation = workspaces, 1, 2, snappy, slide
}

# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
dwindle {
    pseudotile = true
    preserve_split = true
    force_split = 2
}

# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hyprland.org/Configuring/Variables/#misc
misc {
    disable_hyprland_logo = true
    disable_splash_rendering  = true
    focus_on_activate = true
    anr_missed_pings = 3
    on_focus_under_fullscreen = 1
}

# https://wiki.hypr.land/Configuring/Variables/#cursor
cursor {
    hide_on_key_press = true
}

# Auto toggle scratchpad on switching workspace from scratchpad
binds {
    hide_special_on_workspace_change = true
}

# Style Gum confirm to match DedSec theme
env = GUM_CONFIRM_PROMPT_FOREGROUND,6       # Cyan
env = GUM_CONFIRM_SELECTED_FOREGROUND,0     # Black
env = GUM_CONFIRM_SELECTED_BACKGROUND,2     # Green
env = GUM_CONFIRM_UNSELECTED_FOREGROUND,7   # White
env = GUM_CONFIRM_UNSELECTED_BACKGROUND,8   # Dark grey
