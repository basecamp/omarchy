# HP EliteBook X G2i (SKU D4DU1UT#ABA) internal speaker tuning.
#
# This is HP's own per-board DTS:X Ultra ("Eagle") speaker voicing, carried
# verbatim: the biquad coefficients below are decoded from the factory blob
# dts_gpeq_mode1_{48k,44k}_8E86103C.bin (the graphic/parametric EQ bank the
# Windows DTS APO loads for the default "Music" content mode on the internal
# stereo speakers), preceded by the 100 Hz 2nd-order high-pass the same mode
# enables (EFX:Eagle-HPF Enable=1, Freq=100, Order=2 in
# dts_apo4_oem_config_8E86103C.xml), and followed by the standard Omarchy
# lookahead limiter in place of DTS's MBHL protection stage.
#
# Blob format (verified by decoding both sample-rate variants to the same
# curve): int32 LE words; word0 = section count (24), word1 = 0, then per
# section 6 words: [qflag, b0, b1, b2, a1, a2] with coefficients in
# Q(32-qflag) fixed point and the feedback terms stored for
# y[n] = ... + a1*y[n-1] + a2*y[n-2] (negated here for PipeWire's RBJ
# convention). The bank is duplicated at the file midpoint for L/R; both
# banks are identical, so the same chain serves both channels. Unused
# sections have qflag = 0. See README.md next to this file.
#
# bq_raw is used instead of fitted Freq/Q/Gain sections so the response is
# bit-exact to HP's tuning at 48 kHz and 44.1 kHz, the two rates DTS ships
# coefficients for. (The 44.1 kHz bank sits ~2.1 dB hotter overall as
# shipped by DTS; the limiter absorbs that if the graph ever runs at 44.1
# kHz. In practice the graph follows the 48 kHz speaker sink.)
#
# Channels are wired explicitly because the limiter is a stereo plugin; a mono
# graph is duplicated per channel and would limit each side independently,
# shifting the stereo image on bass transients.

context.modules = [
  { name = libpipewire-module-filter-chain
    args = {
