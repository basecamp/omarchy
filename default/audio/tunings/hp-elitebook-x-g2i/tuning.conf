## HP EliteBook X G2i internal speakers (quad TAS2783 smart amps).
##
## A 100 Hz order-2 high-pass, thirteen biquads carried bit-exact from HP's
## factory DTS:X Ultra tuning, and a lookahead limiter, applied as a PipeWire
## filter-chain in front of the internal speaker sink. The stock Linux path
## already programs the TAS2783 amps (with the -12 dB safety trim on the
## per-amp Speaker Volume controls); this adds the perceptual voicing the
## Windows DTS APO layer provides and Linux does not.

description="HP EliteBook X G2i speakers"
## Matched on the DMI product SKU, the narrowest identifier for this board.
## The DTS tuning is keyed per-board by HP (subsystem ID 8E86103C), so this
## must not widen to other EliteBook models whose speakers differ.
##
##   D4DU1UT#ABA  EliteBook X G2i -- the board the DTS data was extracted from
match_sku=("D4DU1UT#ABA")
## Unescaped dots: this is passed to awk as a string, where a backslash escape
## would be consumed before the regex sees it.
sink_pattern='^alsa_output.*sof_sdw.*HiFi__Speaker__sink$'

## Provenance. Decoded from HP's own per-board DTS:X Ultra ("Eagle") tuning
## data extracted from this machine's Windows partition:
## extracted-windows/audio-dts-tuning-8E86/HPCMIT8E86103C/. The EQ biquads are
## the factory dts_gpeq_mode1_{48k,44k}_8E86103C.bin banks (the default
## "Music" content mode for the internal stereo speakers, per
## dts_apo4_oem_config_8E86103C.xml), used verbatim rather than re-fitted, so
## the magnitude response is bit-exact to Windows' EQ stage at both shipped
## sample rates. DTS's MBHL protection/loudness stage and TBHDX bass enhancer
## are not reproduced; the Omarchy lookahead limiter stands in for protection.
derived_from="HP/DTS factory tuning blob dts_gpeq_mode1 (SSID 8E86103C), decoded"
validated_hardware="HP EliteBook X G2i (D4DU1UT#ABA, SSID 8E86103C)"

## Group delay swing over 30-300 Hz, computed from the cascade rather than
## measured, since it follows from the coefficients alone. Identical on both
## banks. The swing is dominated by the two high-Q sections at 118 Hz (+4.18 ms)
## and 158 Hz (-1.29 ms) that DTS uses to shape the port region.
bass_group_delay_swing_ms="5.5"

## Worst-case peak against the limiter threshold, across both shipped banks.
##
## NEGATIVE, and reported that way deliberately. The 48 kHz bank peaks at
## +3.66 dB (1.86 kHz, high-pass included) and the limiter input gain of
## -4.66 dB puts a full-scale sine there exactly at the -1 dBFS threshold, so
## that bank has 0.0 dB of headroom. The 44.1 kHz bank as DTS ships it peaks
## 2.12 dB hotter, at +5.78 dB, which lands a full-scale sine 2.12 dB ABOVE the
## threshold. The limiter absorbs it, so nothing clips, but the tuning is not
## transparent at that rate. In practice the graph follows the 48 kHz speaker
## sink; this figure is the honest worst case rather than the common one.
##
## Reproduce both with tools/analyse-filter-chain in the enablement repo.
limiter_headroom_db="-2.1"

## How closely the running filter-chain realises the coefficients above,
## measured on the reference machine: the probe captured through the tuning
## minus the same probe through the bare speaker sink, against the analytic
## response of these same coefficients at 48 kHz. 104 tones, 40 Hz to 15.3 kHz,
## worst single point 0.03 dB. It is this small because nothing acoustic is
## involved -- the target is not another measurement, it is the arithmetic the
## graph is supposed to be doing, and the capture is taken electrically off the
## speaker sink's monitor.
magnitude_rms_db="0.01"

## Loudness range change against the untuned path. The biquad cascade cannot
## alter loudness range; only the limiter can, and only when peaks reach its
## threshold. Measured with a 30 s pink-noise signal of five blocks spanning
## 15.0 LU, peak-limited to -1 dBFS so the limiter is genuinely exercised:
## 15.0 LU untuned, 15.1 LU through the tuning.
##
## The multitone probe cannot measure this and must not be used for it: it is
## stationary, so it has no loudness range to change and both paths return
## 0.0 LU no matter what the limiter did.
dynamic_range_delta_lu="0.1"
