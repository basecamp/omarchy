## HP EliteBook X G2i internal speakers (quad TAS2783 smart amps).
##
## A 100 Hz order-2 high-pass, thirteen biquads carried bit-exact from HP's
## factory DTS:X Ultra tuning, and a lookahead limiter, applied as a PipeWire
## filter-chain in front of the internal speaker sink. The stock Linux path
## already programs the TAS2783 amps (with the -12 dB safety trim on the
## per-amp Speaker Volume controls); this adds the perceptual voicing the
## Windows DTS APO layer provides and Linux does not.

description="HP EliteBook X G2i speakers"
## Matched on the DMI product SKU, the narrowest identifier for this board.
## The DTS tuning is keyed per-board by HP (subsystem ID 8E86103C), so this
## must not widen to other EliteBook models whose speakers differ.
##
##   D4DU1UT#ABA  EliteBook X G2i -- the board the DTS data was extracted from
match_sku=("D4DU1UT#ABA")
## Unescaped dots: this is passed to awk as a string, where a backslash escape
## would be consumed before the regex sees it.
sink_pattern='^alsa_output.*sof_sdw.*HiFi__Speaker__sink$'

## Provenance. Decoded from HP's own per-board DTS:X Ultra ("Eagle") tuning
## data extracted from this machine's Windows partition:
## extracted-windows/audio-dts-tuning-8E86/HPCMIT8E86103C/. The EQ biquads are
## the factory dts_gpeq_mode1_{48k,44k}_8E86103C.bin banks (the default
## "Music" content mode for the internal stereo speakers, per
## dts_apo4_oem_config_8E86103C.xml), used verbatim rather than re-fitted, so
## the magnitude response is bit-exact to Windows' EQ stage at both shipped
## sample rates. DTS's MBHL protection/loudness stage and TBHDX bass enhancer
## are not reproduced; the Omarchy lookahead limiter stands in for protection.
derived_from="HP/DTS factory tuning blob dts_gpeq_mode1 (SSID 8E86103C), decoded"
validated_hardware="HP EliteBook X G2i (D4DU1UT#ABA, SSID 8E86103C)"

## Headroom: the EQ cascade (high-pass included) peaks at +3.66 dB at 1.86 kHz
## on the 48 kHz bank. The limiter input gain of -4.66 dB places a full-scale
## sine at that frequency exactly at the -1 dBFS limiter threshold.
limiter_headroom_db="0.0"
