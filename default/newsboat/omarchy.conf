# Managed Omarchy integration for Newsboat. Add personal overrides to config,
# not this file. ANSI colors follow the active Omarchy terminal palette.

browser "omarchy-launch-browser %u"
auto-reload no
prepopulate-query-feeds yes
show-read-feeds no
confirm-exit no

feedlist-title-format "  Feeds · finite edition"
feedlist-format "  %n  %11u  %t"
articlelist-title-format "  %T · %u unread"
articlelist-format "  %4i  %D  %?T?|%-18T|  ?%t"

color background default default
color listnormal default default
color listfocus black cyan bold
color listnormal_unread cyan default bold
color listfocus_unread black cyan bold
color info black cyan bold
color article default default
highlight article "^(Title|Feed|Author|Date|Link):.*" cyan default bold
highlight article "https?://[^ ]+" blue default underline

bind-key j down
bind-key k up
bind-key J next-feed
bind-key K prev-feed
bind-key g home
bind-key G end
bind-key l open
bind-key h quit
bind-key o open-in-browser
# Browser subscriptions update the urls file outside Newsboat. Re-read it
# before collecting so a running Feeds window picks up new subscriptions.
bind r feedlist reload-urls; reload-all -- "Refresh subscriptions and feeds"

# Press comma then a to open the selected article with Omarchy's default agent.
bind ,a articlelist,article set browser "omarchy-newsboat-handoff article %u %T %F"; open-in-browser-noninteractively; set browser "omarchy-launch-browser %u" -- "Ask the default agent about this article"

# Press comma then b to brief the whole unread edition with the default agent.
# edit-urls can run from the synthetic Inbox query; browser operations cannot.
# Keep Feeds beside the agent; confirmed triage closes it just before import.
bind ,b everywhere edit-urls "omarchy-newsboat-handoff brief" -- "Brief and triage the unread edition with the default agent"

# Press comma then d to find complementary feeds from the selected article.
# Feed Scout validates its proposal and only subscribes after exact confirmation.
# The first quit leaves the article list; the second closes the feed list so a
# later confirmed subscription update cannot leave a stale reader on screen.
bind ,d articlelist set browser "omarchy-newsboat-handoff scout %u %T %F"; open-in-browser-noninteractively; set browser "omarchy-launch-browser %u"; quit; quit -- "Discover worthwhile feeds with the default agent"
bind ,d article set browser "omarchy-newsboat-handoff scout %u %T %F"; open-in-browser-noninteractively; set browser "omarchy-launch-browser %u"; quit; quit; quit -- "Discover worthwhile feeds with the default agent"
# The feed list has no selected article, and its Inbox is not a browser URL.
bind ,d feedlist edit-urls "omarchy-newsboat-handoff scout"; quit -- "Discover feeds across all subscriptions"
