# Managed Omarchy integration for Newsboat. Add personal overrides to config,
# not this file. ANSI colors follow the active Omarchy terminal palette.

browser "omarchy-launch-browser %u"
auto-reload no
prepopulate-query-feeds yes
show-read-feeds no
confirm-exit no

feedlist-title-format "  Feeds · finite edition"
feedlist-format "  %n  %11u  %t"
articlelist-title-format "  %T · %u unread"
articlelist-format "  %4i  %D  %?T?|%-18T|  ?%t"

color background default default
color listnormal default default
color listfocus black cyan bold
color listnormal_unread cyan default bold
color listfocus_unread black cyan bold
color info black cyan bold
color article default default
highlight article "^(Title|Feed|Author|Date|Link):.*" cyan default bold
highlight article "https?://[^ ]+" blue default underline

bind-key j down
bind-key k up
bind-key J next-feed
bind-key K prev-feed
bind-key g home
bind-key G end
bind-key l open
bind-key h quit
bind-key o open-in-browser
bind-key r reload-all

# Press comma then a to open the selected article with Omarchy's default agent.
macro a set browser "omarchy-agent-newsboat %u %T %F"; open-in-browser-noninteractively; set browser "omarchy-launch-browser %u" -- "Ask the default agent about this article"
