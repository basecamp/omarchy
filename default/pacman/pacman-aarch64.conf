# See the pacman.conf(5) manpage for option and repository directives
#
# Package sources for an aarch64 install (see install/post-install/pacman.sh).
# Omarchy's pacman-<channel>.conf files describe an x86_64 machine:
# [core]/[extra]/[multilib] come from Omarchy's mirror of Arch, which builds
# x86_64 only, and [multilib] is 32-bit x86 libraries that exist on no ARM
# mirror at all. Arch Linux ARM supplies the equivalents here.
#
# [options] is kept byte-identical to the x86_64 channel configs so the two
# architectures behave the same; only the repository list differs.
#
# One file, not one per channel, because Arch Linux ARM has no channels and the
# only channel-varying section -- [omarchy] -- is absent below. Retire that
# when the Omarchy package repository serves aarch64: this then splits into
# pacman-{stable,rc,edge}-aarch64.conf exactly as the x86_64 files do.

[options]
Color
ILoveCandy
VerbosePkgLists
HoldPkg = pacman glibc
Architecture = auto
CheckSpace
ParallelDownloads = 5
DownloadUser = alpm

# By default, pacman accepts packages signed by keys that its local keyring
# trusts (see pacman-key and its man page), as well as unsigned packages.
SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional

# pacman searches repositories in the order defined here.
#
# [core] [extra] [alarm] [aur] is Arch Linux ARM's stock set. [alarm] carries
# its ARM-specific packages; [aur] carries its builds of AUR-origin packages,
# which on x86_64 Omarchy ships from [omarchy] instead. Deviating from the
# distribution default needs a reason, and there isn't one yet.
[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[alarm]
Include = /etc/pacman.d/mirrorlist

[aur]
Include = /etc/pacman.d/mirrorlist

# [omarchy] is deliberately absent: the Omarchy package repository serves no
# aarch64 tree, so including it makes every pacman -Sy fail on a 404. Omarchy's
# own packages stay at the versions the ISO installed until that tree exists;
# everything else updates normally. Restore the section when it does.
