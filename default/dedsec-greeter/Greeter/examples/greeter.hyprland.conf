# Minimal Hyprland config for the DedSec greeter session.
# This runs under the greeter user via greetd -- NOT the user's main session.

# Use the monitor's native resolution automatically
monitor = , 1920x1080@60, auto, 1

# Execute the DedSec greeter in greetd mode
exec-once = env DEDSEC_MODE=greetd quickshell --path /opt/dedsec/Greeter

animations {
    enabled = false
}

misc {
    background_color = rgba(050A0EFF)
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
}

cursor {
    inactive_timeout = 3
}
