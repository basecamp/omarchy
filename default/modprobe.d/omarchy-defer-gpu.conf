# Native GPU drivers must not load in the initramfs while hibernation is
# configured: a driver bound by the boot kernel before the resume hook fires
# suspends and resets hardware the restored kernel then cannot reclaim, which
# hangs or faults resume-from-hibernate (amdgpu CIK, NVIDIA, nouveau).
# Plymouth renders the LUKS prompt on simpledrm instead, and the real root
# loads the right driver immediately after switch_root.
#
# This file is copied into the initramfs by the omarchy-defer-gpu initcpio
# hook. It must never land in the host's /etc/modprobe.d: mkinitcpio's
# modconf hook copies that directory into the image, but a host copy would
# also block the drivers on the running system.
#
# blacklist suppresses udev/modalias autoloading, and mkinitcpio's init loads
# MODULES=() with modprobe -qab, whose -b applies blacklists to explicit
# names too - so this also covers the nvidia early-KMS MODULES drop-in.
blacklist amdgpu
blacklist radeon
blacklist nouveau
blacklist nvidia
blacklist nvidia_drm
blacklist nvidia_modeset
blacklist nvidia_uvm
blacklist i915
blacklist xe
