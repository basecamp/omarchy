# Logitech MX Keys S -- action-row keys
#
# This is a template. install/hardware/logitech-mx-keys.sh copies it to
# /etc/keyd/logitech-mx-keys.conf when it detects an MX Keys S, prepending an
# [ids] section built from the detector's output -- the receiver id when the
# keyboard is on the Bolt receiver, its own id when it is on Bluetooth, so keyd
# never grabs a receiver that only some other keyboard uses. The installed
# file's presence also gates the Hyprland binds in
# default/hypr/bindings/logitech-mx-keys.lua.
#
# The action row (emoji, screenshot, dictation, mic mute, lock, ...) does not
# send Fn keys. Each key sends a fixed chord that Logi Options+ is expected to
# intercept; there is no Options+ on Linux, so the chords fall through to
# whatever they happen to match -- the emoji key does nothing useful, the
# screenshot key's Super+Shift+S opens the Google Maps web app, the lock key's
# Super+L toggles the workspace layout.
#
# keyd rewrites the chorded keys to spare F14-F17 keycodes; the mic-mute key
# already emits a bare F13. Hyprland binds them by keycode (code:191..195), so
# they work regardless of keymap. No existing Omarchy shortcut changes: F13-F24
# are otherwise unused, and a keyd binding is unaffected by the modifiers of
# the layer it sits in (see keyd(1)), so each chord below produces a clean
# F-key while every other key and combination passes through untouched.
#
# Behind the Bolt receiver the id keyd grabs is the receiver's, shared with
# anything else paired to it (e.g. an MX Master). The k: prefix limits the grab
# to keyboard interfaces, so a co-paired mouse keeps working; its unmapped keys
# pass through.

[meta]
h = f16
l = f17

[meta+shift]
s = f15

[meta+control+alt+shift]
space = f14
