source = ~/.config/omarchy/current/theme/hyprlock.conf

general {
    ignore_empty_input = true
}

background {
    monitor =
    color = $color
    path = ~/.config/omarchy/current/background
    blur_passes = 5
}

animations {
    enabled = false
}

# ── Top-left: Date readout ──────────────────────────────────────
label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%Y.%m.%d // %A")"
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    color = rgba(176, 244, 230, 0.5)

    position = 24, -24
    halign = left
    valign = top
}

# ── Top-right: Node identifier ──────────────────────────────────
label {
    monitor =
    text = cmd[update:0] echo "NODE: $(hostname) // $(hostname -I 2>/dev/null | awk '{print $1}')"
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    color = rgba(176, 244, 230, 0.5)

    position = -24, -24
    halign = right
    valign = top
}

# ── Center: Clock ───────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M:%S")"
    font_size = 64
    font_family = JetBrainsMono Nerd Font
    color = $font_color

    position = 0, 140
    halign = center
    valign = center

    shadow_passes = 1
    shadow_size = 6
}

# ── Auth input ──────────────────────────────────────────────────
input-field {
    monitor =
    size = 450, 70
    position = 0, 0
    halign = center
    valign = center

    inner_color = $inner_color
    outer_color = $outer_color
    outline_thickness = 3

    font_family = JetBrainsMono Nerd Font
    font_color = $font_color

    placeholder_text = // AUTHENTICATE
    check_color = $check_color
    fail_text = <i>// ACCESS DENIED [$ATTEMPTS]</i>

    rounding = 0
    shadow_passes = 0
    fade_on_empty = false
}

# ── Below input: Access warning ─────────────────────────────────
label {
    monitor =
    text = AUTHORIZED ACCESS ONLY
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    color = rgba(176, 244, 230, 0.4)

    position = 0, -55
    halign = center
    valign = center
}

# ── Bottom-center: System identity ──────────────────────────────
label {
    monitor =
    text = cmd[update:0] echo "DedSec OS v$(omarchy-version 2>/dev/null || echo '?')"
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    color = rgba(176, 244, 230, 0.25)

    position = 0, 24
    halign = center
    valign = bottom
}

auth {
    fingerprint:enabled = false
}
